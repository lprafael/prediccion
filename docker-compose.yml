services:
  # ─── 1. Base de Datos PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: poliverso_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-prediccion_basket}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prediccion_basket"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. Aplicación Principal: FastAPI + React SPA + WebSockets ───────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poliverso_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-prediccion_basket}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      ODDS_API_SPORTS: ${ODDS_API_SPORTS:-}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      API_FOOTBALL_COUNTRIES: ${API_FOOTBALL_COUNTRIES:-Paraguay}
      API_FOOTBALL_MAX_PRED: ${API_FOOTBALL_MAX_PRED:-15}
      CRUCE_INTERVAL_MIN: ${CRUCE_INTERVAL_MIN:-60}
      # Plan gratuito de The Odds API (500 creditos/mes): reutilizar probabilidades 24 h
      ODDS_CACHE_MIN: ${ODDS_CACHE_MIN:-1440}
      ODDS_API_MARKETS: ${ODDS_API_MARKETS:-h2h}
      APOSTA_LIGAS: ${APOSTA_LIGAS:-}
      POLIVERSO_API_KEY: ${POLIVERSO_API_KEY:-}
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"

  # ─── 3. Servicio Streamlit (Fallback opcional) ───────────────────────────────
  # Para levantarlo junto al principal: docker compose --profile fallback up
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poliverso_streamlit
    profiles:
      - fallback
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-prediccion_basket}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "8501:8501"

volumes:
  postgres_data:
    driver: local
